  <title id="title">Offshore wind and monopile foundation</title>
  <desc id="desc">A colourful schematic of offshore wind turbines and a foreground monopile extending through the water into the seabed. A detail shows soil grains. The illustration is not to scale and is not a simulation result.</desc>
